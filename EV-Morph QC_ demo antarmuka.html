<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
CL=["Utuh","Rusak","Artefak","Tidak pasti"],CC=["#2E7D5B","#C8702A","#A8413A","#A67C00"],
DF=["Kontur tertutup dan kontinu, batas membran tegas, lumen tidak kolaps.","Membran terputus, kontur berkeping atau kolaps.","Endapan stain, debris, agregat, atau partikel non-vesikular.","Ahli tidak sepakat atau citra buram. Tidak dipakai sebagai label latih."],
SM=[{n:"TEM_A.png",k:44,w:[.72,.14,.08,.06],s:7},{n:"TEM_B.png",k:58,w:[.6,.2,.12,.08],s:21},{n:"TEM_C.png",k:36,w:[.8,.08,.06,.06],s:99}],W=960,H=620,
st={i:0,sc:2,mn:30,mx:200,tau:.7,seed:42,o:[],ran:0,sel:-1,log:[],hash:"belum dihitung",f:[1,1,1,1],busy:0,fl:0},
rng=a=>()=>{a|=0;a=a+1831565813|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},
cls=o=>o.fc??o.p,dia=o=>2*o.r*st.sc,inr=o=>dia(o)>=st.mn&&dia(o)<=st.mx,flag=o=>!o.rv&&o.cf<st.tau,
now=()=>new Date().toLocaleTimeString("id-ID"),log=m=>st.log.push([now(),m]),
toast=t=>{const e=$("#ts");e.textContent=t;e.style.display="block";clearTimeout(st.tm);st.tm=setTimeout(()=>e.style.display="none",3500)},
mod=(t,h)=>{$("#mt").textContent=t;$("#mb").innerHTML=h;$("#mo").style.display="flex";$("#mo button").focus()},cl=()=>$("#mo").style.display="none",
pls=n=>$("#pl").innerHTML=["A. Segmentasi (FRU-Net)","B. Pengukuran","C. Klasifikasi few-shot","D. Keyakinan dan review","E. Laporan batch"].map((s,i)=>`<li class="${i<n?"dn":i==n?"ac":""}">${s}${i<n?" ✓":""}</li>`).join("");
function gen(i){const m=SM[i],R=rng(m.s),o=[];for(let n=0;n<m.k+2;n++){const u=R(),t=n>=m.k?2:u<m.w[0]?0:u<m.w[0]+m.w[1]?1:u<1-m.w[3]?2:3,r=n>=m.k?58:t==2?4+R()*6:12+R()*28;for(let q=0;q<80;q++){const x=r+8+R()*(W-2*r-16),y=r+8+R()*(H-2*r-16);if(o.every(a=>Math.hypot(a.x-x,a.y-y)>a.r+r+5)){o.push({id:o.length+1,x,y,r,t,a:R()*6.28,rd:[.9+R()*.09,.6+R()*.25,.5+R()*.4,.7+R()*.25][t]});break}}}return o}
function ves(x,o){x.save();x.translate(o.x,o.y);const r=o.r;if(o.t==2){x.fillStyle="#262a2c";x.beginPath();for(let k=0;k<10;k++){const q=k/10*6.283,u=r*(.7+.4*Math.abs(Math.sin(k*2.3+o.a)));x[k?"lineTo":"moveTo"](u*Math.cos(q),u*Math.sin(q))}x.fill()}else{const g=x.createRadialGradient(0,0,r*.1,0,0,r);g.addColorStop(0,"#8f989d");g.addColorStop(.8,"#cdd5d8");g.addColorStop(1,"#eef2f3");x.globalAlpha=o.t==3?.5:1;x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,6.283);x.fill();x.lineWidth=Math.max(2,r*.13);x.strokeStyle="#23282a";x.beginPath();x.arc(0,0,r,o.a,o.a+(o.t==1?4:6.283));x.stroke()}x.restore()}
function draw(){const x=$("#bc").getContext("2d"),R=rng(5);x.fillStyle="#6c747a";x.fillRect(0,0,W,H);for(let n=0;n<9000;n++){x.fillStyle=R()<.5?"rgba(255,255,255,.06)":"rgba(0,0,0,.08)";x.fillRect(R()*W,R()*H,2,2)}const v=x.createRadialGradient(W/2,H/2,W/4,W/2,H/2,W*.7);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.35)");x.fillStyle=v;x.fillRect(0,0,W,H);st.o.forEach(o=>ves(x,o))}
function ring(x,o,r,c,w,d){x.setLineDash([]);x.strokeStyle="rgba(0,0,0,.5)";x.lineWidth=w+3;x.beginPath();x.arc(o.x,o.y,r,0,6.283);x.stroke();x.setLineDash(d);x.strokeStyle=c;x.lineWidth=w;x.stroke()}
function paint(){const x=$("#ov").getContext("2d"),L=100/st.sc;x.clearRect(0,0,W,H);x.setLineDash([]);x.fillStyle="#fff";x.fillRect(24,H-30,L,5);x.font="14px system-ui";x.shadowColor="#000";x.shadowBlur=4;x.fillText("100 nm",24,H-38);x.shadowBlur=0;if(!st.ran)return;st.o.forEach(o=>{const k=cls(o);if(!inr(o))return ring(x,o,o.r+4,"#d6dde0",1.5,[3,4]);if(!st.f[k])return;ring(x,o,o.r+4,CC[k],2.5,k==3?[5,4]:[]);if(flag(o)){x.fillStyle="#F6C945";x.fillRect(o.x+o.r,o.y-o.r-12,9,9)}if(o.rv){x.fillStyle="#fff";x.fillText("✓",o.x+o.r,o.y-o.r)}});const s=st.o[st.sel];if(s)ring(x,s,s.r+10,"#fff",3,[])}
function upd(){paint();const A=st.ran?st.o.filter(inr):[],n=[0,0,0,0];A.forEach(o=>n[cls(o)]++);const T=A.length,pc=k=>T?Math.round(n[k]/T*100):0,F=A.filter(flag).length,med=a=>{a=a.slice().sort((p,q)=>p-q);return a.length?a[a.length>>1]:0};st.fl=F;
document.querySelectorAll(".chip").forEach((b,k)=>{b.querySelector("b").textContent=n[k];b.setAttribute("aria-pressed",!!st.f[k])});
$("#pc").textContent=st.ran?CL.map((c,k)=>c+" "+pc(k)+"%").join(" · "):"";$("#sb").innerHTML=n.map((v,k)=>`<span style="width:${pc(k)}%;background:${CC[k]}"></span>`).join("");
$("#mnv").textContent=st.mn;$("#mxv").textContent=st.mx;$("#tav").textContent=st.tau.toFixed(2);
$("#sm").innerHTML=st.ran?`<dt>Objek terdeteksi</dt><dd>${st.o.length}</dd><dt>Dalam rentang ${st.mn}–${st.mx} nm</dt><dd>${T}</dd><dt>Di luar rentang</dt><dd>${st.o.length-T}</dd><dt>Perlu review</dt><dd>${F}</dd><dt>Sudah direview</dt><dd>${A.filter(o=>o.rv).length}</dd><dt>Median diameter</dt><dd>${med(A.map(dia)).toFixed(0)} nm</dd><dt>Median roundness</dt><dd>${med(A.map(o=>o.rd)).toFixed(2)}</dd>`:`<dt class="mt" style="grid-column:1/3">Belum dianalisis. Pilih citra, lalu jalankan analisis.</dt>`;
const g=$("#hg").getContext("2d"),B=Array(14).fill(0),cs=getComputedStyle(document.body);st.ran&&st.o.forEach(o=>B[Math.min(13,dia(o)/20|0)]++);const M=Math.max(1,...B);g.clearRect(0,0,896,110);g.setLineDash([]);B.forEach((v,i)=>{g.fillStyle=i*20+20>st.mn&&i*20<st.mx?cs.getPropertyValue("--ac").trim():"#9aa8ad";g.fillRect(i*64+4,88-v/M*80,56,v/M*80)});g.fillStyle=cs.color;g.font="16px system-ui";[[0,"0"],[5,"100"],[10,"200"],[13,"≥260"]].forEach(a=>g.fillText(a[1],a[0]*64+4,106));g.strokeStyle=cs.color;g.setLineDash([4,4]);[st.mn,st.mx].forEach(v=>{g.beginPath();g.moveTo(v/20*64,0);g.lineTo(v/20*64,88);g.stroke()});
const s=st.o[st.sel],I=$("#in");if(!s||!st.ran)I.innerHTML=`<p class="mt">Klik vesikel pada citra untuk melihat detail.</p>`;else{const k=cls(s),io=inr(s);I.innerHTML=`<div class="ir"><canvas id="zc" width="96" height="96"></canvas><dl class="st"><dt>Vesikel</dt><dd>#${s.id}</dd><dt>Kelas</dt><dd>K${k+1} ${CL[k]}</dd><dt>Diameter</dt><dd>${dia(s).toFixed(0)} nm</dd><dt>Roundness</dt><dd>${s.rd.toFixed(2)}</dd><dt>Keyakinan</dt><dd>${s.cf.toFixed(2)}</dd></dl></div><div class="bar" role="img" aria-label="Keyakinan ${Math.round(s.cf*100)} persen"><span style="width:${s.cf*100}%;background:${CC[k]}"></span></div><p class="${flag(s)&&io?"wn":"mt"}">${!io?"Di luar rentang ukuran; tidak dihitung.":s.rv?"Direview: "+s.rv.u+", "+s.rv.t+".":flag(s)?"Perlu review. Keyakinan di bawah ambang "+st.tau.toFixed(2)+".":"Keyakinan di atas ambang."}</p><div class="r"><button class="b p" id="ap">Setujui</button><button class="b" id="ub">Ubah kelas</button></div>`;$("#zc").getContext("2d").drawImage($("#bc"),s.x-s.r-8,s.y-s.r-8,2*s.r+16,2*s.r+16,0,0,96,96)}
$("#mdt").innerHTML=`<dt>Citra</dt><dd>${SM[st.i].n}</dd><dt>Model</dt><dd>v0.1 (simulasi)</dd><dt>Konfigurasi</dt><dd>cfg-demo-1</dd><dt>Seed</dt><dd>${st.seed}</dd><dt>SHA-256 citra</dt><dd title="${st.hash}">${st.hash.slice(0,12)}…</dd>`;
$("#au").innerHTML=st.log.slice(-8).reverse().map(l=>`<li><span class="mt">${l[0]}</span> ${l[1]}</li>`).join("");if(!st.busy)pls(st.ran?5:-1)}
function run(){if(st.busy)return;st.busy=1;st.ran=0;st.sel=-1;st.o.forEach(o=>{delete o.p;delete o.rv;delete o.fc;delete o.cf});upd();let n=0;const t=()=>{pls(n);if(n<5){n++;setTimeout(t,420)}else{const R=rng(st.seed+st.i);st.o.forEach(o=>{const e=o.t!=2&&R()<.1;o.p=e?(o.t+1+Math.floor(R()*3))%4:o.t;o.cf=o.p==o.t?.6+.39*Math.pow(R(),.6):.4+.3*R();if(o.t==3)o.cf=Math.min(o.cf,.5+.25*R())});st.ran=1;st.busy=0;log("Analisis selesai (simulasi), seed "+st.seed+", τ "+st.tau.toFixed(2));upd();toast("Analisis selesai (simulasi). "+st.fl+" vesikel perlu review.")}};t()}
function nxt(){const L=st.o.filter(o=>inr(o)&&flag(o));if(!st.ran||!L.length)return toast(st.ran?"Tidak ada vesikel yang perlu direview.":"Jalankan analisis terlebih dahulu.");const c=L.find(o=>o.id>(st.o[st.sel]?.id||0))||L[0];st.sel=st.o.indexOf(c);upd()}
const hsh=async()=>{try{const d=$("#bc").getContext("2d").getImageData(0,0,W,H).data;st.hash=[...new Uint8Array(await crypto.subtle.digest("SHA-256",d))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(_){st.hash="tidak tersedia"}upd()};
function load(i){st.i=i;st.o=gen(i);st.ran=0;st.sel=-1;st.hash="menghitung…";draw();log("Citra dimuat: "+SM[i].n);upd();hsh()}
function upm(){mod("Unggah dan validasi citra",`<div class="dz">Pilih berkas TIFF, PNG, atau JPG<br><input type="file" id="fi" accept=".tif,.tiff,.png,.jpg,.jpeg"></div><div id="vr" aria-live="polite"></div><p class="mt">Mode demo: analisis berjalan pada citra sintetis. Berkas unggahan hanya divalidasi (format, ukuran, hash SHA-256); pemrosesan nyata menunggu model terhubung.</p><h3>Citra contoh</h3><div class="r">${SM.map((m,i)=>`<button class="b${i==st.i?" p":""}" data-s="${i}">${m.n} (${m.k+2} objek)</button>`).join("")}</div>`);
$("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;const ok=/\.(tiff?|png|jpe?g)$/i.test(f.name);let h="";if(ok){try{h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",await f.arrayBuffer()))].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(_){h="tidak tersedia"}}
$("#vr").innerHTML=ok?`<p class="ok">Diterima: ${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB<br>SHA-256: ${h.slice(0,16)}…</p>`:`<p class="er">Ditolak: ${esc(f.name)}. Format tidak didukung. Gunakan TIFF, PNG, atau JPG.</p>`;log("Validasi berkas "+esc(f.name)+(ok?": diterima":": ditolak"));upd()}}
function rlm(){const s=st.o[st.sel];if(!s)return;const k=cls(s);mod("Ubah kelas vesikel #"+s.id,`<div role="radiogroup">${CL.map((c,j)=>`<label class="rd"><input type="radio" name="k" value="${j}" ${j==k?"checked":""}> <b>K${j+1} ${c}</b><br><span class="mt">${DF[j]}</span></label>`).join("")}</div><label>Catatan ahli (opsional)<textarea id="nt" rows="2"></textarea></label><div class="r" style="margin-top:8px"><button class="b p" id="sv">Simpan koreksi</button><button class="b" data-x="1">Batal</button></div>`);
$("#sv").onclick=()=>{const j=+document.querySelector("input[name=k]:checked").value,n=cls(s),nt=$("#nt").value;s.fc=j;s.rv={u:"Analis (demo)",t:now()};log("Koreksi #"+s.id+": "+CL[n]+" → "+CL[j]+(nt?" ("+esc(nt)+")":""));cl();upd();toast("Koreksi disimpan dan dicatat pada jejak audit.")}}
function rpm(){if(!st.ran)return toast("Jalankan analisis terlebih dahulu.");const A=st.o.filter(inr),n=[0,0,0,0];A.forEach(o=>n[cls(o)]++);const T=A.length||1,p=k=>n[k]/T*100,F=A.filter(flag).length,R=[["Vesikel utuh","≥ 70%",p(0).toFixed(0)+"%",p(0)>=70],["Vesikel rusak","≤ 15%",p(1).toFixed(0)+"%",p(1)<=15],["Tidak pasti","≤ 5%",p(3).toFixed(0)+"%",p(3)<=5],["Kappa terhadap ahli","≥ 0,60","Belum diukur",null],["Error diameter","≤ 10%","Belum diukur",null]],D=F?"Perlu review":R.some(r=>r[3]===false)?"Gagal (kriteria terukur)":"Lulus (kriteria terukur)",csv="id,kelas,diameter_nm,roundness,keyakinan,direview,dalam_rentang\n"+st.o.map(o=>[o.id,CL[cls(o)],dia(o).toFixed(1),o.rd.toFixed(2),o.cf.toFixed(2),o.rv?1:0,inr(o)?1:0].join(",")).join("\n");log("Laporan batch dibuka. Keputusan: "+D);upd();

const abm=()=>mod("Tentang demo dan batasan",`<p>Demo antarmuka EV-Morph QC untuk Open Innovation Faculty 2026 (Tema 1: AI dan Big Data dalam Farmasi). Alur mengikuti PRD: segmentasi, pengukuran, klasifikasi integritas few-shot, review ahli, dan laporan batch dengan jejak audit.</p><h3>Yang disimulasikan</h3><ul><li>Citra TEM dibuat sintetis di peramban.</li><li>Deteksi dan klasifikasi memakai label sintetis dengan derau acak (seed tetap), bukan model terlatih.</li><li>Angka tidak boleh dikutip sebagai hasil penelitian.</li></ul><h3>Yang nyata</h3><ul><li>Kalibrasi, filter ukuran, ambang τ, review, koreksi, dan laporan bekerja langsung.</li><li>Hash SHA-256 dan jejak audit dihitung pada sesi ini.</li></ul><h3>Batasan produk</h3><ul><li>Bukan alat diagnosis klinis dan bukan penilai muatan atau fungsi EV.</li><li>Bukan sertifikasi atau bukti kepatuhan regulasi.</li><li>Tidak menggantikan NTA, flow cytometry, atau Western blot.</li></ul><button class="b p" data-x="1">Mengerti</button>`);
